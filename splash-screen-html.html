<!-- SPLASH SCREEN HTML - ADD TO index.html AFTER <body> TAG -->

<!-- Splash Screen Modal -->
<div class="splash-screen" id="splashScreen">
    <button class="splash-close" onclick="closeSplash()" aria-label="Close">×</button>
    
    <div class="splash-content">
        <div class="splash-logo">ScentMatch</div>
        
        <h1 class="splash-title">✨ Discover Your Signature Scent</h1>
        
        <p class="splash-subtitle">
            AI-powered perfume matching tailored to your unique preferences
        </p>
        
        <div class="splash-features">
            <div class="splash-feature">✨ 30-Second Personalized Quiz</div>
            <div class="splash-feature">🤖 Claude AI Recommendations</div>
            <div class="splash-feature">🎁 Instant Shopping Links</div>
            <div class="splash-feature">💝 5 Perfect Perfume Matches</div>
        </div>
        
        <button class="splash-cta" onclick="startFromSplash()">
            Begin Your Scent Journey
        </button>
        
        <p class="splash-skip" onclick="closeSplash()">
            or continue to homepage
        </p>
        
        <p class="splash-trust">
            Join thousands discovering their perfect fragrance ✨
        </p>
    </div>
</div>
